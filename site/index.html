<!doctype html>
<html lang="he" dir="rtl" data-display="hangar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>מירי דייטש</title>
<meta name="description" content="מגיעה למוצר שלך במה שנראית בינלאומית ומוכרת">
<link rel="preload" href="fonts-licensed/Sprinter-VF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts-licensed/Hangar-ExtraBlack.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.classList.add("js")</script>
<script src="vendor/gsap.min.js" defer></script>
<script src="vendor/ScrollTrigger.min.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/cloth.js" type="module"></script>
</head>
<body>
<a class="skip" href="#main">דילוג לתוכן</a>

<!-- 0 · הדר: הוסר לבינתיים, לבקשת מירי (27.10). העיצוב שלו נשאר ב-site.css -->

<main id="main">

  <!-- 1 · מסך פתיחה: למעלה הלוגו על שחור (M פוקסיה, IRI לבן), כמעט לכל הרוחב. מתחת תמונה שהופכת לווילון, קצת יותר גבוהה מהלוגו -->
  <section class="hero" id="top" aria-label="מירי דייטש">
    <div class="hero__top">
      <svg class="hero__logo" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><use href="img/logo-miri.svg#logo"/></svg>
    </div>
    <figure class="hero__curtain" data-cloth-slot>
      <img class="hero__img" src="img/curtain.webp" alt="" width="1672" height="941">
    </figure>
    <canvas class="hero__canvas" aria-hidden="true"></canvas>
    <p class="label hero__hint" data-cloth-hint hidden>גררי את הווילון <span class="draft">טיוטה</span></p>
  </section>

  <!-- המשפט והשורה: מתחת למסך הפתיחה, כי בחלק העליון יש רק לוגו. בלי כפתור לבינתיים -->
  <section class="intro" aria-labelledby="hero-title">
    <p class="label"><bdi dir="ltr">SCENE 01</bdi></p>
    <h1 class="h-2" id="hero-title">מגיעה למוצר שלך <span class="accent">במה</span> שנראית בינלאומית ומוכרת</h1>
    <p class="lead">אתרי תדמית וחנויות לבעלות ובעלי מוצר <span class="draft">טיוטה</span></p>
  </section>

</main>

<!-- וואטסאפ צף הוסר לבינתיים, לבקשת מירי (27.10). הקוד והעיצוב שלו נשארו ב-main.js וב-site.css -->
<!-- לוח טיוטה: השוואת פונט כותרות + מצב נפילות לברירת מחדל. להסיר לפני עלייה -->
<details class="draft-panel">
  <summary class="label">טיוטה · פונט כותרות</summary>
  <div class="draft-panel__fonts" role="group" aria-label="פונט כותרות">
    <button type="button" data-font="hangar" aria-pressed="true"><bdi dir="ltr">Hangar</bdi></button>
    <button type="button" data-font="nostela" aria-pressed="false"><bdi dir="ltr">Nostela</bdi></button>
  </div>
  <ul class="draft-panel__status" data-status></ul>
</details>

<div class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
