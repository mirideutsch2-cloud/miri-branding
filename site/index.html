<!doctype html>
<html lang="he" dir="rtl" data-display="hangar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>מירי דייטש · טיוטה</title>
<meta name="description" content="מגיעה למוצר שלך במה שנראית בינלאומית ומוכרת">
<link rel="preload" href="fonts-licensed/Sprinter-VF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts-licensed/Hangar-ExtraBlack.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.classList.add("js")</script>
<script src="vendor/gsap.min.js" defer></script>
<script src="vendor/ScrollTrigger.min.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/cloth.js" type="module"></script>

<body>
<a class="skip" href="#main">דילוג לתוכן</a>

<!-- 0 · הדר: לוגו · תפריט פתוח · כפתור. סטיקי, בלי רשתות חברתיות.
     המסכים שהקישורים מובילים אליהם עוד לא נבנו: data-pending מציג הודעה גלויה -->
<header class="site-header">
  <div class="site-header__in">
    <a class="logo" href="#top" aria-label="מירי דייטש, לראש העמוד">
      <bdi dir="ltr" class="logo__word" aria-hidden="true"><span class="logo__m">M</span>IRI</bdi>
      <bdi dir="ltr" class="logo__deutsch" aria-hidden="true">DEUTSCH</bdi>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">תפריט</button>
    <nav class="site-nav" id="site-nav" aria-label="ראשי">
      <ul>
        <li><a href="#how" data-pending>איך זה עובד</a></li>
        <li><a href="#projects" data-pending>פרויקטים</a></li>
        <li><a href="#about" data-pending>אודות</a></li>
      </ul>
    </nav>
    <a class="btn btn--light site-header__cta" href="#contact" data-pending>לשיחת היכרות</a>
  </div>
</header>

<main id="main">

  <!-- 1 · מסך פתיחה, מחולק לשניים: למעלה הלוגו בלבן מלא, למטה תמונה שהופכת לווילון -->
  <section class="hero" id="top" aria-labelledby="hero-title">
    <div class="hero__top">
      <p class="hero__logo" aria-hidden="true"><bdi dir="ltr"><span class="hero__logo-m">M</span>IRI<span class="hero__logo-deutsch">DEUTSCH</span></bdi></p>
      <div class="hero__copy">
        <div class="hero__text">
          <p class="label"><bdi dir="ltr">SCENE 01</bdi></p>
          <h1 class="h-2" id="hero-title">מגיעה למוצר שלך <span class="accent">במה</span> שנראית בינלאומית ומוכרת</h1>
          <p class="lead">אתרי תדמית וחנויות לבעלות ובעלי מוצר <span class="draft">טיוטה</span></p>
        </div>
        <div class="hero__action">
          <a class="btn btn--light" href="#contact" data-pending>לשיחת היכרות</a>
          <p class="label hero__hint" data-cloth-hint hidden>גררי את הווילון <span class="draft">טיוטה</span></p>
        </div>
      </div>
    </div>
    <figure class="hero__curtain" data-cloth-slot>
      <img class="hero__img" src="img/curtain-placeholder.svg" alt="" width="2400" height="1600">
    </figure>
    <canvas class="hero__canvas" aria-hidden="true"></canvas>
  </section>

</main>

<!-- וואטסאפ צף: תמיד גלוי, מימין למטה -->

<!-- לוח טיוטה: השוואת פונט כותרות + מצב נפילות לברירת מחדל. להסיר לפני עלייה -->
<details class="draft-panel">
  <summary class="label">טיוטה · פונט כותרות</summary>
  <div class="draft-panel__fonts" role="group" aria-label="פונט כותרות">
    <button type="button" data-font="hangar" aria-pressed="true"><bdi dir="ltr">Hangar</bdi></button>
    <button type="button" data-font="nostela" aria-pressed="false"><bdi dir="ltr">Nostela</bdi></button>
  </div>
  <ul class="draft-panel__status" data-status></ul>
</details>

<div class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
