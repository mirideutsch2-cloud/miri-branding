<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- מקום שמור: כסא במאי מלמעלה, זווית מעט מעוותת. להחליף בתמונה הסופית (ראו docs/ASSETS.md). -->
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a393c"/>
      <stop offset="1" stop-color="#1a191c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#floor)"/>
  <polygon points="0,180 520,0 1200,0 1200,420 360,1200 0,1200" fill="#ffffff" fill-opacity=".16"/>
  <!-- צל ארוך אלכסוני -->
  <polygon points="420,520 820,470 1180,1040 760,1110" fill="#000000" fill-opacity=".45"/>
  <!-- מסגרת עץ -->
  <g stroke="#0e0d10" stroke-width="22" stroke-linecap="round">
    <line x1="380" y1="410" x2="840" y2="860"/>
    <line x1="840" y1="400" x2="370" y2="870"/>
  </g>
  <!-- משענות יד -->
  <rect x="330" y="330" width="56" height="560" rx="18" fill="#0e0d10"/>
  <rect x="824" y="320" width="56" height="580" rx="18" fill="#0e0d10"/>
  <!-- גב (מעוות קלות, עדשה רחבה) -->
  <polygon points="300,250 910,236 880,330 330,342" fill="#EC008C"/>
  <!-- מושב -->
  <rect x="392" y="430" width="426" height="380" fill="#EC008C"/>
  <rect x="420" y="458" width="370" height="324" fill="none" stroke="#0e0d10" stroke-opacity=".55" stroke-width="5" stroke-dasharray="14 10"/>
  <rect x="24" y="24" width="1152" height="1152" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="4" stroke-dasharray="18 14"/>
  <text x="600" y="1100" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff" direction="rtl">מקום שמור · כסא במאי מלמעלה</text>
</svg>
