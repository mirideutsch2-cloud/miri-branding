<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
  <!-- מקום שמור לתמונה שהופכת לווילון (החצי התחתון של מסך הפתיחה). להחליף בתמונה הסופית, ראו docs/ASSETS.md -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2b2f"/>
      <stop offset="1" stop-color="#141317"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <rect width="2400" height="1600" fill="url(#wall)"/>
  <polygon points="1500,0 2100,0 1100,1600 500,1600" fill="url(#shaft)"/>
  <rect x="-200" y="900" width="2800" height="110" fill="#E0218A" transform="rotate(-6 1200 955)"/>
  <rect x="40" y="40" width="2320" height="1520" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="5" stroke-dasharray="22 16"/>
  <text x="1200" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff" direction="rtl">מקום שמור · תמונה שהופכת לווילון</text>
  <text x="1200" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" fill="#ffffff" fill-opacity=".8" direction="ltr">2400 × 1600</text>
</svg>
