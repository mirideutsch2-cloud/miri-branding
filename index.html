<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מיתוג מירי · פונטים</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --ink: #111; --paper: #fff; --pink: #ff1f8e; --muted: #777; --line: #f3c4dc; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; }
  header { padding: 48px 16px 24px; max-width: 1100px; margin: 0 auto; }
  header h1 { margin: 0; font: 800 clamp(48px, 10vw, 120px)/1 "Miri Block"; direction: ltr; text-align: left; }
  header h1 span { color: var(--pink); }
  header p { color: var(--muted); letter-spacing: .2em; font-size: 13px; }
  section { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; border-top: 1px solid var(--line); }
  h2 { font-size: 14px; letter-spacing: .25em; color: var(--pink); margin: 0 0 8px; }
  .row { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center; padding: 18px 0; border-bottom: 1px solid #f6f6f6; }
  .tag { justify-self: start; background: var(--pink); color: #fff; border-radius: 999px; padding: 6px 14px; font: 700 12px/1 system-ui; letter-spacing: .15em; white-space: nowrap; }
  .sample { direction: ltr; text-align: left; font-size: clamp(28px, 5vw, 52px); line-height: 1.25; overflow-wrap: anywhere; }
  .try { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; direction: ltr; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1><span>Miri</span> Block <span style="font-family:'Miri Script';font-weight:800">Script</span></h1>
  <p>שתי משפחות פונטים · ארבעה משקלים לכל אחת</p>
  <input class="try" id="try" placeholder="Type to preview… / הקלידי טקסט באנגלית לתצוגה">
</header>

<section id="block">
  <h2>MIRI BLOCK</h2>
</section>
<section id="script">
  <h2>MIRI SCRIPT</h2>
</section>

<script>
  const weights = [["THIN", 100], ["REGULAR", 400], ["BOLD", 700], ["EXTRA BOLD", 800]];
  const text = "ABCDEFGHIJKLM NOPQRSTUVWXYZ abcdefghijklm nopqrstuvwxyz 0123456789 .:";
  const samples = [];
  for (const [id, family] of [["block", "Miri Block"], ["script", "Miri Script"]]) {
    const sec = document.getElementById(id);
    for (const [label, w] of weights) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="tag">${label}</span><div class="sample" style="font-family:'${family}';font-weight:${w}"></div>`;
      const s = row.querySelector(".sample");
      s.textContent = text;
      samples.push(s);
      sec.appendChild(row);
    }
  }
  document.getElementById("try").addEventListener("input", e => {
    for (const s of samples) s.textContent = e.target.value || text;
  });
</script>
</body>
</html>
